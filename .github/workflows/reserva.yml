name: Reserva SREF

on:
  workflow_dispatch:
    inputs:
      reserva_json:
        description: "Dados da reserva em JSON"
        required: true
        type: string
      enviar_solicitacao:
        description: "Enviar solicitação no SREF?"
        required: true
        default: false
        type: boolean

jobs:
  reservar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Executar automação
        env:
          RESERVA_JSON: ${{ inputs.reserva_json }}
          ENVIAR_SOLICITACAO: ${{ inputs.enviar_solicitacao }}
          SREF_USUARIO: ${{ secrets.SREF_USUARIO }}
          SREF_SENHA: ${{ secrets.SREF_SENHA }}
        run: |
          python automation/reserva_sref.py

      - name: Salvar print da reserva
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reserva-preenchida
          path: reserva_preenchida.png
          if-no-files-found: ignore
