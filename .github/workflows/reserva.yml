name: Reserva SREF

on:
  repository_dispatch:
    types:
      - reserva_sref

jobs:
  reservar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Executar automação
        env:
          RESERVA_JSON: ${{ github.event.client_payload.reserva_json }}
          ENVIAR_SOLICITACAO: ${{ github.event.client_payload.enviar_solicitacao }}
          SREF_USUARIO: ${{ secrets.SREF_USUARIO }}
          SREF_SENHA: ${{ secrets.SREF_SENHA }}
        run: |
          python automation/reserva_sref.py

      - name: Salvar prints da automação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-reserva
          path: |
            reserva_preenchida.png
            reserva_erro.png
          if-no-files-found: ignore
