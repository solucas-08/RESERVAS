<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva SREF</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input, textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #interpretar {
            background: #444;
            color: white;
        }

        #realizar {
            background: #16803c;
            color: white;
        }

        #recusar {
            background: #b42318;
            color: white;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .info {
            background: #eef5ff;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Reserva SREF</h1>

    <div class="info">
        Cole abaixo o conteúdo do e-mail de solicitação.
        Depois clique em <b>INTERPRETAR</b>, confira/edite os dados e clique em
        <b>REALIZAR</b>.
    </div>

    <label for="emailOriginal">E-mail da solicitação</label>
    <textarea id="emailOriginal"
        placeholder="Cole aqui o e-mail completo..."></textarea>

    <div class="buttons">
        <button id="interpretar" onclick="interpretarEmail()">
            INTERPRETAR
        </button>
    </div>

    <hr style="margin:30px 0; border:0; border-top:1px solid #ddd;">

    <h2>Dados da reserva</h2>

    <div class="grid">

        <div>
            <label>Tipo da reserva</label>
            <select id="tipo_reserva">
                <option value="Individual">Individual</option>
                <option value="Recorrente">Recorrente</option>
            </select>
        </div>

        <div>
            <label>Tipo de sala</label>
            <select id="tipo_sala">
                <option value="LABORATORIO">LABORATORIO</option>
                <option value="MA">MA</option>
                <option value="AUDITORIO">AUDITORIO</option>
            </select>
        </div>

        <div>
            <label>Data inicial</label>
            <input id="data_inicio" type="date">
        </div>

        <div>
            <label>Data final</label>
            <input id="data_final" type="date">
        </div>

        <div>
            <label>Hora inicial</label>
            <input id="hora_inicio" type="time">
        </div>

        <div>
            <label>Hora final</label>
            <input id="hora_fim" type="time">
        </div>

        <div>
            <label>Sala SREF</label>
            <input id="sala" placeholder="Ex.: 05_LAB">
        </div>

        <div>
            <label>Tipo do evento</label>
            <input id="tipo_evento" placeholder="Ex.: Palestra">
        </div>

        <div>
            <label>Quantidade de alunos</label>
            <input id="quantidade" type="number">
        </div>

        <div>
            <label>Solicitante</label>
            <input id="solicitante">
        </div>

        <div>
            <label>E-mail</label>
            <input id="email">
        </div>

        <div>
            <label>Reservado para</label>
            <input id="reservado_para">
        </div>

    </div>

    <label>Espaço original</label>
    <input id="espaco_original">

    <label>Descrição</label>
    <textarea id="descricao"></textarea>

    <div class="buttons">

        <button id="realizar" onclick="realizarReserva()">
            REALIZAR
        </button>

        <button id="recusar" onclick="recusarReserva()">
            RECUSAR
        </button>

    </div>

    <div id="status"></div>

</div>


<script>

/*
==========================================================
CONFIGURAÇÃO DO TESTE
==========================================================

COLOQUE AQUI:

1. Seu usuário do GitHub
2. Nome do repositório
3. Seu token

NÃO envie o token para mim.
*/

const GITHUB_OWNER = "solucas-08";
const GITHUB_REPO = "RESERVAS";
const GITHUB_TOKEN = "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";

const EVENT_TYPE = "reserva_sref";


/*
==========================================================
UTILIDADES
==========================================================
*/

function valor(id) {
    return document.getElementById(id).value.trim();
}

function preencher(id, valorCampo) {
    document.getElementById(id).value = valorCampo || "";
}

function mostrarStatus(mensagem, sucesso = true) {

    const status = document.getElementById("status");

    status.style.display = "block";
    status.style.background = sucesso ? "#e7f6ec" : "#fdecec";
    status.style.color = sucesso ? "#146c2e" : "#a61b1b";

    status.innerText = mensagem;
}


/*
==========================================================
NORMALIZAÇÃO DE DATA
==========================================================
*/

function normalizarData(texto) {

    if (!texto) return "";

    texto = texto.trim();

    /*
    dd/mm
    dd/mm/yy
    dd/mm/yyyy
    */

    let m = texto.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/);

    if (!m) return "";

    let dia = m[1].padStart(2, "0");
    let mes = m[2].padStart(2, "0");

    let ano = m[3];

    if (!ano) {
        ano = "2026";
    }
    else if (ano.length === 2) {
        ano = "20" + ano;
    }

    return `${ano}-${mes}-${dia}`;
}


/*
==========================================================
CONVERTE HORA
==========================================================
*/

function normalizarHora(texto) {

    if (!texto) return "";

    let m = texto.match(/(\d{1,2}):(\d{2})/);

    if (!m) {
        m = texto.match(/(\d{1,2})h(?:\s*(\d{2}))?/i);
    }

    if (!m) return "";

    let hora = m[1].padStart(2, "0");
    let minuto = m[2] ? m[2].padStart(2, "0") : "00";

    return `${hora}:${minuto}`;
}


/*
==========================================================
TIPO DA SALA
==========================================================
*/

function descobrirTipoSala(espaco) {

    const texto = espaco.toLowerCase();

    if (
        texto.includes("laboratório") ||
        texto.includes("laboratorio") ||
        texto.includes("lab")
    ) {
        return "LABORATORIO";
    }

    if (
        texto.includes("ma") ||
        texto.includes("sala ma")
    ) {
        return "MA";
    }

    if (
        texto.includes("auditório") ||
        texto.includes("auditorio")
    ) {
        return "AUDITORIO";
    }

    return "";
}


/*
==========================================================
INTERPRETAÇÃO DO E-MAIL
==========================================================
*/

function interpretarEmail() {

    const texto = document.getElementById("emailOriginal").value;

    if (!texto.trim()) {
        mostrarStatus("Cole primeiro o conteúdo do e-mail.", false);
        return;
    }

    /*
    SETOR
    */

    let setor =
        texto.match(/Setor:\s*(.+)/i);

    /*
    SOLICITANTE
    */

    let solicitante =
        texto.match(/Solicitante:\s*(.+)/i);

    /*
    EMAIL
    */

    let email =
        texto.match(/Email:\s*([^\s\r\n]+)/i);

    /*
    TIPO DA RESERVA
    */

    let tipoReserva =
        texto.match(/Tipo da reserva:\s*(.+)/i);

    /*
    DATA
    */

    let data =
        texto.match(/Data da reserva:\s*(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i);

    /*
    HORÁRIO
    */

    let horario =
        texto.match(/Horário de início\/término:\s*(.+)/i);

    /*
    ESPAÇO
    */

    let espaco =
        texto.match(/Espaço:\s*(.+)/i);

    /*
    TIPO DO EVENTO
    */

    let evento =
        texto.match(/Tipo do evento:\s*(.+)/i);

    /*
    NOME DO EVENTO
    */

    let nomeEvento =
        texto.match(/Nome do evento ou da disciplina:\s*(.+)/i);

    /*
    QUANTIDADE
    */

    let quantidade =
        texto.match(/Quantidade de alunos:\s*(\d+)/i);


    /*
    PREENCHIMENTO
    */

    preencher(
        "tipo_reserva",
        tipoReserva && /recorrente/i.test(tipoReserva[1])
            ? "Recorrente"
            : "Individual"
    );


    if (data) {
        preencher(
            "data_inicio",
            normalizarData(data[1])
        );
    }


    if (horario) {

        let horas =
            horario[1].match(
                /(\d{1,2}:\d{2}|\d{1,2}h)\s*(?:às|as|-)\s*(\d{1,2}:\d{2}|\d{1,2}h)/i
            );

        if (horas) {

            preencher(
                "hora_inicio",
                normalizarHora(horas[1])
            );

            preencher(
                "hora_fim",
                normalizarHora(horas[2])
            );
        }
    }


    if (espaco) {

        const espacoOriginal = espaco[1].trim();

        preencher(
            "espaco_original",
            espacoOriginal
        );

        let tipoSala =
            descobrirTipoSala(espacoOriginal);

        if (tipoSala) {
            preencher("tipo_sala", tipoSala);
        }


        /*
        Tenta transformar Laboratório 05
        em 05_LAB
        */

        let lab =
            espacoOriginal.match(
                /laborat[oó]rio\s*(\d+)/i
            );

        if (lab) {

            preencher(
                "sala",
                `${lab[1].padStart(2, "0")}_LAB`
            );
        }


        if (/audit[oó]rio/i.test(espacoOriginal)) {

            preencher(
                "sala",
                "AUDITÓRIO"
            );
        }


        /*
        Sala MA / MA
        */

        let ma =
            espacoOriginal.match(
                /\bMA\b/i
            );

        if (ma) {

            preencher(
                "sala",
                "400"
            );
        }
    }


    if (evento) {

        preencher(
            "tipo_evento",
            evento[1].trim()
        );
    }


    if (quantidade) {

        preencher(
            "quantidade",
            quantidade[1]
        );
    }


    if (solicitante) {

        preencher(
            "solicitante",
            solicitante[1].trim()
        );

        preencher(
            "reservado_para",
            solicitante[1].trim()
        );
    }


    if (email) {

        preencher(
            "email",
            email[1].trim()
        );
    }


    /*
    DESCRIÇÃO
    */

    let descricao = "";

    if (nomeEvento) {
        descricao = nomeEvento[1].trim();
    }

    preencher(
        "descricao",
        descricao
    );


    mostrarStatus(
        "Dados interpretados. Confira e edite antes de clicar em REALIZAR."
    );
}


/*
==========================================================
MONTA OBJETO DA RESERVA
==========================================================
*/

function montarReserva() {

    return {

        tipo_reserva: valor("tipo_reserva"),

        data_inicio: valor("data_inicio"),

        data_final: valor("data_final"),

        hora_inicio: valor("hora_inicio"),

        hora_fim: valor("hora_fim"),

        tipo_sala: valor("tipo_sala"),

        sala: valor("sala"),

        tipo_evento: valor("tipo_evento"),

        quantidade: Number(valor("quantidade")),

        solicitante: valor("solicitante"),

        email: valor("email"),

        espaco_original: valor("espaco_original"),

        reservado_para: valor("reservado_para"),

        descricao: valor("descricao")
    };
}


/*
==========================================================
DISPARA GITHUB ACTIONS
==========================================================
*/

async function realizarReserva() {

    const reserva = montarReserva();


    /*
    VALIDAÇÕES
    */

    if (!reserva.data_inicio) {
        mostrarStatus("Informe a data inicial.", false);
        return;
    }

    if (!reserva.hora_inicio || !reserva.hora_fim) {
        mostrarStatus("Informe os horários.", false);
        return;
    }

    if (!reserva.tipo_sala) {
        mostrarStatus("Informe o tipo de sala.", false);
        return;
    }

    if (!reserva.sala) {
        mostrarStatus("Informe a sala SREF.", false);
        return;
    }


    /*
    AVISO
    */

    const confirmar = confirm(
        "Confirma a execução da automação?\n\n" +
        "O GitHub Actions será iniciado e o Selenium irá preencher a reserva no SREF.\n\n" +
        "Neste teste o botão Solicitar do SREF NÃO será clicado."
    );

    if (!confirmar) {
        return;
    }


    const url =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/dispatches`;


    try {

        mostrarStatus(
            "Enviando solicitação para o GitHub..."
        );


        const resposta =
            await fetch(url, {

                method: "POST",

                headers: {

                    "Accept":
                        "application/vnd.github+json",

                    "Authorization":
                        `Bearer ${GITHUB_TOKEN}`,

                    "X-GitHub-Api-Version":
                        "2022-11-28",

                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    event_type: EVENT_TYPE,

                    client_payload: {

                        reserva_json:
                            JSON.stringify(reserva),

                        enviar_solicitacao:
                            false
                    }
                })
            });


        if (!resposta.ok) {

            const erro =
                await resposta.text();

            throw new Error(
                `GitHub retornou ${resposta.status}: ${erro}`
            );
        }


        mostrarStatus(
            "✓ GitHub Actions acionado com sucesso. Agora acompanhe a execução no GitHub."
        );

    }
    catch (erro) {

        console.error(erro);

        mostrarStatus(
            "Erro ao acionar o GitHub: " + erro.message,
            false
        );
    }
}


/*
==========================================================
RECUSAR
==========================================================
*/

function recusarReserva() {

    const confirmar =
        confirm(
            "Deseja realmente recusar esta solicitação?"
        );

    if (!confirmar) {
        return;
    }

    mostrarStatus(
        "Solicitação recusada."
    );
}

</script>

</body>
</html>
