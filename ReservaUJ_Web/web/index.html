<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserva UJ</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a}h1{margin:0 0 6px}p{color:#5c6670}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:600;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;border:1px solid #c8d0d8;border-radius:8px;padding:9px;font:inherit}.field input[readonly]{background:#f6f7f8}.field.full{grid-column:1/-1}.textarea{width:100%;box-sizing:border-box;border:1px solid #c8d0d8;border-radius:8px;padding:9px;font:inherit;min-height:220px;resize:vertical}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}button{border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#interpretar{background:#e8eef7}#realizar{background:#1f7a45;color:#fff}#recusar,#limpar{background:#eee}.status{margin-top:10px;font-weight:600}.warn{color:#a35b00}.ok{color:#1f7a45}.error{color:#b42318}.hidden{display:none}.days{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}.day{display:inline-flex;align-items:center;gap:5px;border:1px solid #c8d0d8;border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer}.day input{width:auto}.hint{font-size:13px;color:#68737d;margin-top:5px}.invalid{border-color:#b42318!important;background:#fff7f7!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>RESERVA UJ</h1><p>Cole o conteúdo do e-mail tratado pelo Power Automate. Os campos abaixo continuam editáveis antes da execução.</p></div>
<div class="card"><h2>1. Solicitação</h2><textarea id="email" class="textarea" placeholder="Cole aqui o conteúdo do e-mail..."></textarea><div class="actions"><button id="interpretar">INTERPRETAR</button><button id="limpar">LIMPAR</button></div></div>
<div class="card"><h2>2. Confira e edite</h2><div class="grid" id="fields"></div><div id="daysWrap" class="field full hidden"><label>Dias da semana</label><div class="days">
<label class="day"><input type="checkbox" value="SEG" data-num="1"> SEG</label>
<label class="day"><input type="checkbox" value="TER" data-num="2"> TER</label>
<label class="day"><input type="checkbox" value="QUA" data-num="3"> QUA</label>
<label class="day"><input type="checkbox" value="QUI" data-num="4"> QUI</label>
<label class="day"><input type="checkbox" value="SEX" data-num="5"> SEX</label>
<label class="day"><input type="checkbox" value="SAB" data-num="6"> SÁB</label>
<label class="day"><input type="checkbox" value="DOM" data-num="7"> DOM</label>
</div><div class="hint">Para reserva recorrente, selecione pelo menos um dia.</div></div><div class="actions"><button id="recusar">RECUSAR</button><button id="realizar" disabled>REALIZAR</button></div><div id="status" class="status"></div></div>
</div>
<script>
var labels={tipo_reserva:'Tipo da reserva',data_inicio:'Data início',data_final:'Data final',hora_inicio:'Horário início',hora_fim:'Horário fim',tipo_sala:'Tipo de sala',sala:'Sala SREF',tipo_evento:'Tipo do evento',quantidade_alunos:'Quantidade',solicitante:'Solicitante',email:'E-mail',espaco_original:'Espaço original',descricao:'Descrição'};
var fields={};
Object.keys(labels).forEach(function(k){var d=document.createElement('div');d.className='field';var l=document.createElement('label');l.textContent=labels[k];var i;if(k==='tipo_reserva'||k==='tipo_sala'){i=document.createElement('select');if(k==='tipo_reserva'){['Individual','Recorrente'].forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;i.appendChild(o);});}else{[['','Selecione...'],['SALA','SALA'],['LABORATORIO','LABORATORIO'],['MA','MA'],['AUDITORIO','AUDITORIO']].forEach(function(v){var o=document.createElement('option');o.value=v[0];o.textContent=v[1];i.appendChild(o);});}}else{i=document.createElement('input');if(k==='data_inicio'||k==='data_final')i.type='date';else if(k==='hora_inicio'||k==='hora_fim')i.type='time';else if(k==='quantidade_alunos')i.type='number';if(k==='espaco_original')i.readOnly=true;}i.id=k;d.appendChild(l);d.appendChild(i);document.getElementById('fields').appendChild(d);fields[k]=i;});
// Sala SREF é independente do Espaço original e é sempre escolhida a partir do Tipo de sala.
var salaOptions={
  LABORATORIO:[['00_LAB','00_LAB'],['01_LAB','01_LAB'],['02_LAB','02_LAB'],['03_LAB','03_LAB'],['05_LAB','05_LAB'],['07_LAB','07_LAB'],['08_LAB','08_LAB'],['09_LAB','09_LAB'],['11_LAB','11_LAB']],
  MA:[['400','400']],
  AUDITORIO:[['AUDITÓRIO','AUDITÓRIO']]
};
var salaInput=fields.sala;
var salaParent=salaInput.parentNode;
var salaSelect=document.createElement('select');
salaSelect.id='sala'; salaSelect.name='sala';
salaParent.replaceChild(salaSelect,salaInput); fields.sala=salaSelect;
function updateSalaOptions(preferred){
  var tipo=fields.tipo_sala.value, opts=salaOptions[tipo]||[], old=preferred||fields.sala.value||'';
  while(fields.sala.firstChild) fields.sala.removeChild(fields.sala.firstChild);
  var ph=document.createElement('option'); ph.value=''; ph.textContent='Selecione...'; fields.sala.appendChild(ph);
  for(var i=0;i<opts.length;i++){var o=document.createElement('option');o.value=opts[i][0];o.textContent=opts[i][1];fields.sala.appendChild(o);}
  if(old){for(var j=0;j<fields.sala.options.length;j++){if(fields.sala.options[j].value===old){fields.sala.value=old;break;}}}
}
updateSalaOptions('');
fields.tipo_sala.addEventListener('change',function(){updateSalaOptions('');validate();});
fields.sala.addEventListener('change',validate);
fields.tipo_reserva.addEventListener('change',function(){toggleRecurring();validate();});
var known=['Setor','Solicitante','Email','Tipo da reserva','Data da reserva','Horário de início/término','Espaço','Tipo do evento','Recursos necessários','Nome do evento ou da disciplina','Quantidade de alunos','Pode ser feito em duplas'];
function clean(s){return (s||'').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');}
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function field(text,label){var next='';var i;for(i=0;i<known.length;i++){if(known[i]!==label)next+=(next?'|':'')+esc(known[i]);}var r=new RegExp('^\\s*'+esc(label)+'\\s*:\\s*([\\s\\S]*?)(?=^\\s*(?:'+next+')\\s*:|$)','im');var m=r.exec(text||'');return m?clean(m[1]):'';}
function parseTimeToken(s){s=clean(s).toLowerCase().replace(/\bhoras?\b/g,'h').replace(/\s+/g,'');var m=/^(\d{1,2})(?::|h)?(\d{2})?h?$/.exec(s);if(!m)return '';var h=parseInt(m[1],10),mi=m[2]?parseInt(m[2],10):0;if(h>23||mi>59)return '';return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;}
function hours(v){v=clean(v).replace(/[–—]/g,'-').replace(/\bàs\b/gi,'-').replace(/\bas\b/gi,'-');var parts=v.split(/\s*-\s*/);var out=[];var i,m;for(i=0;i<parts.length;i++){m=/\b(\d{1,2}(?::\d{2}|h\d{2}|h)?)\b/i.exec(parts[i]);if(m){var t=parseTimeToken(m[1]);if(t)out.push(t);}}if(out.length>=2)return [out[0],out[1]];var re=/(\d{1,2})(?::(\d{2}))?\s*h?/gi,out2=[],x;while((x=re.exec(v))!==null){var h=parseInt(x[1],10),mi=x[2]?parseInt(x[2],10):0;if(h<=23&&mi<=59)out2.push((h<10?'0':'')+h+':'+(mi<10?'0':'')+mi);}return out2.length>=2?[out2[0],out2[1]]:['',''];}
function dates(v){var a=[],r=/(\d{1,2})\/(\d{1,2})\/(\d{4})/g,m;while((m=r.exec(v||''))!==null){var y=Number(m[3]),mo=Number(m[2]),d=Number(m[1]),dt=new Date(y,mo-1,d);if(dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d)a.push(y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2));}return a;}
function inferDays(ds){var names=['','SEG','TER','QUA','QUI','SEX','SAB','DOM'],seen={},out=[],i;for(i=0;i<ds.length;i++){var p=ds[i].split('-');var dt=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));var js=dt.getDay();var n=js===0?7:js;if(!seen[n]){seen[n]=true;out.push(names[n]);}}return out;}
function roomInfo(v){var raw=clean(v),x=raw.toLowerCase();var tipo='',sala='';if(/laborat[oó]rios?|laborat[oó]rio/.test(x)){tipo='LABORATORIO';var m=x.match(/laborat[oó]rio\s*(\d{1,2})/i);if(m)sala=('0'+parseInt(m[1],10)).slice(-2)+'_LAB';}else if(/metodologias\s+ativas/.test(x)){tipo='MA';sala='400';}else if(/audit[oó]rio/.test(x)){tipo='AUDITORIO';sala='AUDITÓRIO';}else if(/^\d{2}_lab$/i.test(raw)){tipo='LABORATORIO';sala=raw.toUpperCase();}return {tipo:tipo,sala:sala};}
function toggleRecurring(){var rec=fields.tipo_reserva.value==='Recorrente';document.getElementById('daysWrap').className=rec?'field full':'field full hidden';fields.data_final.parentNode.style.display=rec?'block':'none';if(!rec){fields.data_final.value='';clearDays();}}
function clearDays(){var c=document.querySelectorAll('#daysWrap input[type=checkbox]'),i;for(i=0;i<c.length;i++)c[i].checked=false;}
function setDays(names){clearDays();var c=document.querySelectorAll('#daysWrap input[type=checkbox]'),i,j;for(i=0;i<c.length;i++){for(j=0;j<names.length;j++){if(c[i].value===names[j])c[i].checked=true;}}}
function getDays(){var c=document.querySelectorAll('#daysWrap input[type=checkbox]'),out=[],i;for(i=0;i<c.length;i++)if(c[i].checked)out.push(c[i].value);return out;}
function parse(){var text=document.getElementById('email').value;var tr=field(text,'Tipo da reserva'),ds=dates(field(text,'Data da reserva')),hh=hours(field(text,'Horário de início/término')),esp=field(text,'Espaço'),ri=roomInfo(esp),ev=field(text,'Tipo do evento'),q=field(text,'Quantidade de alunos');var data={tipo_reserva:/recorr/i.test(tr)?'Recorrente':'Individual',data_inicio:ds.length?ds[0]:'',data_final:ds.length>1?ds[ds.length-1]:'',dias_semana:[],hora_inicio:hh[0],hora_fim:hh[1],tipo_sala:ri.tipo,sala:ri.sala,tipo_evento:/^aula$/i.test(clean(ev))?'Curso':clean(ev),quantidade_alunos:(q.match(/\d+/)||[''])[0],solicitante:field(text,'Solicitante'),email:field(text,'Email'),espaco_original:esp,descricao:field(text,'Nome do evento ou da disciplina')};fields.tipo_reserva.value=data.tipo_reserva;fields.data_inicio.value=data.data_inicio;fields.data_final.value=data.data_final;fields.hora_inicio.value=data.hora_inicio;fields.hora_fim.value=data.hora_fim;fields.tipo_sala.value=data.tipo_sala;updateSalaOptions(data.sala);fields.sala.value=data.sala;fields.tipo_evento.value=data.tipo_evento;fields.quantidade_alunos.value=data.quantidade_alunos;fields.solicitante.value=data.solicitante;fields.email.value=data.email;fields.espaco_original.value=data.espaco_original;fields.descricao.value=data.descricao;toggleRecurring();if(data.tipo_reserva==='Recorrente')setDays(inferDays(ds));validate();}
function validate(){var missing=[];var required=['data_inicio','hora_inicio','hora_fim','sala','tipo_evento','quantidade_alunos','tipo_sala'];var i,k;for(i=0;i<required.length;i++){k=required[i];fields[k].className='';if(!clean(fields[k].value)){missing.push(labels[k]);fields[k].className='invalid';}}if(fields.tipo_reserva.value==='Recorrente'){fields.data_final.className='';if(!fields.data_final.value){missing.push('Data final');fields.data_final.className='invalid';}if(!getDays().length)missing.push('Dias da semana');}var s=document.getElementById('status');if(missing.length){s.className='status warn';s.textContent='Atenção: revise/preencha '+missing.join(', ')+'.';document.getElementById('realizar').disabled=true;return false;}s.className='status ok';s.textContent='Dados válidos. Confira antes de REALIZAR.';document.getElementById('realizar').disabled=false;return true;}
Object.keys(fields).forEach(function(k){fields[k].addEventListener('input',validate);});document.querySelectorAll('#daysWrap input').forEach(function(c){c.addEventListener('change',validate);});
document.getElementById('interpretar').onclick=parse;
document.getElementById('limpar').onclick=function(){document.getElementById('email').value='';Object.keys(fields).forEach(function(k){fields[k].value='';fields[k].className='';});updateSalaOptions('');clearDays();toggleRecurring();document.getElementById('status').textContent='';document.getElementById('realizar').disabled=true;};
document.getElementById('recusar').onclick=function(){document.getElementById('status').className='status';document.getElementById('status').textContent='Solicitação recusada.';document.getElementById('realizar').disabled=true;};
document.getElementById('realizar').onclick=function(){if(!validate())return;var data={},i;Object.keys(fields).forEach(function(k){data[k]=fields[k].value.trim();});data.dias_semana=getDays();localStorage.setItem('reserva_uj_payload',JSON.stringify(data));document.getElementById('status').className='status ok';document.getElementById('status').textContent='Dados validados e prontos para o disparo do GitHub Actions.';console.log(data);};
toggleRecurring();
</script>
</body>
</html>
